<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard MSS 4G</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f9;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 240px;
      background-color: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .sidebar .brand {
      padding: 0 20px 20px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #334155;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    /* Link Menu Navigasi */
    .sidebar a {
      width: 100%;
      padding: 14px 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar a:hover {
      background-color: #334155;
      color: #fff;
    }

    .sidebar a.active {
      background-color: #2563eb;
      color: #fff;
      font-weight: 600;
    }

    /* Main Content Container */
    .main-content {
      flex: 1;
      height: 100vh;
      background-color: #ffffff;
    }

    /* Iframe tempat menampilkan file HTML luar */
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Menu Side -->
  <aside class="sidebar">
    <div class="brand">BAKTI MSS 4G</div>
    
    <!-- 
      ======================================================================
      [PENANDA 1] PEMANGGILAN MENU Utama
      Link ini memanggil file "utama.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
	<!--
  //  <a href="utama.html" target="dashboardFrame" class="nav-link active" onclick="setActive(this)">
      <span>📊</span> Dashboard
    </a>
-->


    <!-- 
      ======================================================================
      [PENANDA 2] PEMANGGILAN MENU 2
      Link ini memanggil file "menu2.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
    <a href="menu4.html" target="dashboardFrame" class="nav-link" onclick="setActive(this)">
      <span>🏗️</span> Site management
    </a>
	<!-- 
      ======================================================================
      [PENANDA 3] PEMANGGILAN MENU 3
      Link ini memanggil file "menu3.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
    <a href="coba.html" target="dashboardFrame" class="nav-link" onclick="setActive(this)">
      <span>📊</span> KPI SLA
    </a>
	
	<!-- 
      ======================================================================
      [PENANDA 3] PEMANGGILAN MENU 3
      Link ini memanggil file "menu3.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
    <a href="menu1.html" target="dashboardFrame" class="nav-link" onclick="setActive(this)">
      <span>✨</span> Kebersihan & CCTV
    </a>
	
		<!-- 
      ======================================================================
      [PENANDA 3] PEMANGGILAN MENU 3
      Link ini memanggil file "menu3.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
    <a href="menu3.html" target="dashboardFrame" class="nav-link" onclick="setActive(this)">
      <span>🛠</span> Preventive Maintenance
    </a>
	
	<!-- 
      ======================================================================
      [PENANDA 3] PEMANGGILAN MENU 3
      Link ini memanggil file "menu3.html" ke dalam iframe yang bernama "dashboardFrame"
      ======================================================================
    -->
    <a href="ticket.html" target="dashboardFrame" class="nav-link" onclick="setActive(this)">
      <span>🛠</span>PM Ticket
    </a>
	
  </aside>
  


  <!-- Area Tampilan Utama -->
  <main class="main-content">
    <!-- 
      ======================================================================
      [PENANDA 3] BINGKAI PEMANGGIL (IFRAME)
      'src' menentukan file yang dipanggil secara default saat pertama diakses (menu1.html)
      'name' harus sama dengan atribut 'target' pada tag <a> di sidebar di atas.
      ======================================================================
    -->
    <iframe name="dashboardFrame" src="menu4.html" class="content-frame"></iframe>
  </main>

  <script>
    // Script sederhana untuk mengubah tampilan tombol menu yang sedang aktif/diklik
    function setActive(element) {
      const links = document.querySelectorAll('.nav-link');
      links.forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }
  </script>

</body>
</html>
